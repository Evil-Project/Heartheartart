services:
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      HEARTHEARTART_RUNTIME: node
      DB_USER: ${DB_USER:-heartheartart}
      DB_PASSWORD: ${DB_PASSWORD:-heartheartart}
      DB_NAME: ${DB_NAME:-heartheartart}
      DB_HOST_PORT: postgres:5432
      HEARTHEARTART_SNAPSHOT_BASE_URL: ${CDN_BASE_URL:-https://cdn.heartheart.art}
      HEARTHEARTART_POST_LIMIT: ${HEARTHEARTART_POST_LIMIT:-50}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DB_USER:-heartheartart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-heartheartart}
      POSTGRES_DB: ${DB_NAME:-heartheartart}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - .env
    environment:
      DB_USER: ${DB_USER:-heartheartart}
      DB_PASSWORD: ${DB_PASSWORD:-heartheartart}
      DB_NAME: ${DB_NAME:-heartheartart}
      DB_HOST_PORT: postgres:5432
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    shm_size: 1gb
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:

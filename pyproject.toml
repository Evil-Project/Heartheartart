[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "heartheartart"
version = "0.1.0"
description = "Capture pages and publish link cards from Discord."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "XiaoYuan151", email = "contact@xiaoyuan151.com" },
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "boto3>=1.43.68",
    "discord-py>=2.7.1",
    "dotenv>=0.9.9",
    "playwright>=1.62.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.51",
]

[project.scripts]
heartheartart = "heartheartart.main:main"

[tool.hatch.build.targets.sdist]
only-include = ["src", "README.md", "LICENSE"]

[tool.pytest.ini_options]
pythonpath = ["src"]
